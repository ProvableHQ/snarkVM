[package]
name = "snarkvm-algorithms"
version = "4.9.0"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Algorithms for a decentralized virtual machine"
homepage = "https://aleo.org"
repository = "https://github.com/ProvableHQ/snarkVM"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [
  "compilers",
  "cryptography",
  "mathematics",
  "wasm",
  "web-programming"
]
include = [ "Cargo.toml", "src", "README.md", "LICENSE.md" ]
license = "Apache-2.0"
edition = "2024"

[[bench]]
name = "variable_base"
path = "benches/msm/variable_base.rs"
harness = false

[[bench]]
name = "poseidon_sponge"
path = "benches/crypto_hash/poseidon.rs"
harness = false

[[bench]]
name = "fft"
path = "benches/fft/fft.rs"
harness = false
bench = false

[[bench]]
name = "varuna"
path = "benches/snark/varuna.rs"
harness = false
required-features = [ "test" ]

[[bench]]
name = "varuna_verifier"
path = "benches/snark/varuna_verifier.rs"
harness = false
required-features = [ "test" ]

[[bench]]
name = "provekit"
path = "benches/snark/provekit.rs"
harness = false
required-features = [ "test", "provekit" ]

[dependencies.snarkvm-curves]
workspace = true

[dependencies.snarkvm-fields]
workspace = true

[dependencies.snarkvm-parameters]
workspace = true

[dependencies.snarkvm-utilities]
workspace = true

[dependencies.snarkvm-algorithms-cuda]
workspace = true
optional = true

[dependencies.aleo-std]
workspace = true

[dependencies.anyhow]
workspace = true

[dependencies.blake2]
version = "0.10"
default-features = true

[dependencies.cfg-if]
workspace = true

[dependencies.fxhash]
version = "0.2.1"

[dependencies.hashbrown]
version = "0.15"

[dependencies.hex]
workspace = true

[dependencies.indexmap]
workspace = true

[dependencies.itertools]
workspace = true

[dependencies.rand]
workspace = true

# spongefish is built against rand 0.8; keep a matching copy for transcript RNG interop.
[dependencies.rand_08]
package = "rand"
version = "0.8.5"
optional = true

[dependencies.rayon]
workspace = true

[dependencies.serde]
workspace = true
features = [ "derive" ]

[dependencies.sha2]
workspace = true

[dependencies.smallvec]
workspace = true
features = [ "const_generics", "const_new" ]

[dependencies.thiserror]
workspace = true

[dependencies.num-traits]
workspace = true

[dependencies.arrayvec]
version = "0.7"
optional = true

[dependencies.base64]
version = "0.22"
optional = true

[dependencies.blake3]
version = "=1.8.3"
features = [ "digest", "traits-preview" ]
optional = true

[dependencies.ciborium]
version = "0.2"
optional = true

[dependencies.const-oid]
version = "0.9"
optional = true

[dependencies.derive-where]
version = "1.6"
features = [ "safe" ]
optional = true

[dependencies.digest]
version = "0.10"
features = [ "oid" ]
optional = true

[dependencies.hex-literal]
version = "0.4"
optional = true

[dependencies.ordered-float]
version = "5"
features = [ "serde" ]
optional = true

[dependencies.postcard]
version = "1.1"
features = [ "use-std" ]
optional = true

[dependencies.sha3]
version = "0.10"
optional = true

[dependencies.spongefish]
git = "https://github.com/arkworks-rs/spongefish"
rev = "fcc277f8a857fdeeadd7cca92ab08de63b1ff1a1"
features = [ "sha2", "blake3", "keccak" ]
optional = true

[dependencies.static_assertions]
version = "1.1"
optional = true

[dependencies.zerocopy]
version = "0.8"
optional = true

[dev-dependencies.expect-test]
workspace = true

[dev-dependencies.bincode]
workspace = true

[dev-dependencies.criterion]
workspace = true

[dev-dependencies.serde_json]
workspace = true
features = [ "preserve_order" ]

[dev-dependencies.serial_test]
workspace = true

[dev-dependencies.snarkvm-parameters]
workspace = true
features = [ "filesystem" ]

[features]
cuda = [ "snarkvm-algorithms-cuda" ]
locktick = [ "snarkvm-parameters/locktick" ]
profiler = [ "aleo-std/profiler" ]
test = [ ]
serial = [
  "snarkvm-curves/serial",
  "snarkvm-fields/serial",
  "snarkvm-utilities/serial"
]
test_exports = [ ]
dev-print = [ "snarkvm-utilities/dev-print" ]
snark-print = [ ]
provekit = [
  "arrayvec",
  "base64",
  "blake3",
  "ciborium",
  "const-oid",
  "derive-where",
  "digest",
  "hex-literal",
  "ordered-float",
  "postcard",
  "rand_08",
  "sha3",
  "spongefish",
  "static_assertions",
  "zerocopy"
]
