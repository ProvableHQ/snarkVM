name: CI - Ledger Tests

on:
  pull_request:
  push:
    branches:
      - master
      - staging
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUST_MIN_STACK: 67108864

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ledger-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ledger-
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.114
      - name: Run Tests
        run: cargo nextest run -p snarkvm-ledger --profile ci

  ledger-with-rocksdb-partition1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ledger-rocks-p1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ledger-rocks-p1-
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.114
      - name: Run Tests
        run: cargo nextest run -p snarkvm-ledger --profile ci --release --features=rocks --partition count:1/2 --test-threads=10

