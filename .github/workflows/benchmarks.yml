name: Run snarkVM Benchmarks

on:
  push:
    branches:
      - 'staging'
      - 'fix/benchmark-ci'
  workflow_dispatch:

jobs:
  # Run Callgrind benchmarks and store instruction counts.
  benchmark:
    name: Benchmark
    # Pin to a specific image to reduce runner-image drift between comparisons.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Override .cargo/config.toml's target-cpu=native. Cached proc-macros and
      # build scripts compiled for one runner CPU SIGILL on another. Keep lld.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      # One Rayon worker. The benches set this too; the workflow covers setup.
      RAYON_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Instruction counts move when rustc changes. Stay on the workspace toolchain.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96

      # RocksDB benches need libclang (via bindgen); match CircleCI rocks deps.
      - name: Install required Debian packages
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            clang libclang-dev llvm-dev llvm lld pkg-config xz-utils make libssl-dev

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Bump the key suffix when RUSTFLAGS change to invalidate poisoned caches.
          key: ${{ runner.os }}-cargo-bench-v3-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup gungraun-runner and Valgrind
        uses: gungraun/setup-gungraun@v1

      - name: Benchmark with Gungraun
        run: |
          set -euo pipefail
          : > output.jsonl
          run_one() {
            local out
            out="$(mktemp)"
            cargo bench --locked "$@" -- --output-format=json >"$out"
            if ! grep '^{' "$out" >> output.jsonl; then
              echo "Gungraun produced no JSON summary for: cargo bench $*" >&2
              cat "$out" >&2
              exit 1
            fi
            rm -f "$out"
          }

          run_one -p snarkvm-algorithms --bench gungraun_variable_base
          run_one -p snarkvm-algorithms --bench gungraun_poseidon_sponge
          run_one -p snarkvm-circuit-environment --bench gungraun_linear_combination
          run_one -p snarkvm-console-account --bench gungraun_account
          run_one -p snarkvm-console-algorithms --bench gungraun_poseidon
          run_one -p snarkvm-console-algorithms --bench gungraun_elligator2
          run_one -p snarkvm-console-collections --bench gungraun_merkle_tree
          run_one -p snarkvm-console-types --bench gungraun_group
          run_one -p snarkvm-curves --bench gungraun_curves
          run_one -p snarkvm-ledger --bench gungraun_block --features=rocks,test-helpers,test
          run_one -p snarkvm-ledger --bench gungraun_dag --features=test-helpers
          run_one -p snarkvm-ledger --bench gungraun_transaction
          run_one -p snarkvm-ledger-puzzle --bench gungraun_puzzle --features=setup

      - name: Convert Gungraun summaries
        run: python3 .github/scripts/gungraun_to_bench_action.py output.jsonl output.json

      # Download previous benchmark result from cache (if exists)
      - name: Download previous benchmark data
        uses: actions/cache@v6
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: snarkVM Gungraun
          tool: 'customSmallerIsBetter'
          output-file-path: output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '10%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@vicsn,@snarkworld,@cbeck88'
          auto-push: true
          summary-always: true
