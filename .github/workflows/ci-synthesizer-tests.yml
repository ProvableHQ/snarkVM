      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.114
      - name: Run Tests
        run: cargo nextest run -p snarkvm-synthesizer --profile ci --test '*' --features test --test-threads=4 --filter-expr 'test(/test_command_parse/)+test(/test_instruction_parse/)+test(/test_process_execute/)+test(/test_program_parse/)+test(/test_vm_execute_and_finalize/)'

