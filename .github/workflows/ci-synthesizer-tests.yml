name: CI - Synthesizer Tests

on:
  pull_request:
  push:
    branches:
      - master
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUST_MIN_STACK: 67108864

jobs:
  synthesizer:
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-synthesizer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-synthesizer-
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.114
      - name: Run Tests
        run: cargo nextest run -p snarkvm-synthesizer --profile ci --lib --bins --test-threads 16

  synthesizer-test-partition1:
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-synthesizer-test1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-synthesizer-test1-
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.114
      - name: Run Tests
        run: cargo nextest run -p snarkvm-synthesizer --profile ci --lib --bins --features test --partition count:1/2 --test-threads 8

  synthesizer-test-partition2:
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 25
