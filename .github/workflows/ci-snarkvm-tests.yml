name: CI - SnarkVM Core Tests

on:
  pull_request:
  push:
    branches:
      - master
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUST_MIN_STACK: 67108864

jobs:
  snarkvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-snarkvm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-snarkvm-
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.114
      - name: Run Tests
        run: cargo nextest run -p snarkvm --profile ci

  algorithms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-algorithms-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-algorithms-
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.114
      - name: Run Tests
        run: cargo nextest run -p snarkvm-algorithms --profile ci

  algorithms-profiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-algorithms-profiler-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-algorithms-profiler-
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.114
      - name: Run Tests
        run: cargo nextest run -p snarkvm-algorithms --profile ci --features profiler --filter-expr 'test(/varuna::prove_and_verify_with_square_matrix/)'

  curves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-curves-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-curves-
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.114
      - name: Run Tests
        run: cargo nextest run -p snarkvm-curves --profile ci

  fields:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fields-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fields-
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.114
      - name: Run Tests
        run: cargo nextest run -p snarkvm-fields --profile ci

  parameters:
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-parameters-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-parameters-
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.114
      - name: Run Tests
        run: cargo nextest run -p snarkvm-parameters --profile ci --test-threads=2

  parameters-large:
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-parameters-large-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-parameters-large-
      - name: Run Tests (no-run)
        # Uses cargo test instead of nextest because --no-run only builds without running tests
        run: cargo test -p snarkvm-parameters --no-run --features large_params

  parameters-uncached:
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.114
      - name: Run Tests
        # Runs only ignored tests matching the filter expression
        run: cargo nextest run -p snarkvm-parameters --profile ci --test-threads=2 --run-ignored ignored-only --filter-expr 'test(/test_load_bytes_mini/)'

  utilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-utilities-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-utilities-
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.114
      - name: Run Tests
        run: cargo nextest run -p snarkvm-utilities --profile ci

  utilities-derives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-utilities-derives-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-utilities-derives-
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.114
      - name: Run Tests
        run: cargo nextest run -p snarkvm-utilities-derives --profile ci

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev llvm lld pkg-config xz-utils make libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Run Tests
        run: cd wasm && wasm-pack test --node
